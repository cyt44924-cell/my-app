<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Telegram Gift Simulator</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #161b26;
            --accent: #0088cc;
            --accent-hover: #00a0e9;
            --text: #ffffff;
            --text-sub: #8b98a5;
            --gold: #ffd700;
            --purple: #9c27b0;
            --legendary: #ff9800;
            --divine: #00ffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at top, #1a2332 0%, #0b0e14 100%);
            padding-bottom: 70px;
        }

        /* Шапка */
        .header {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(22, 27, 38, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .balance-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.4);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .balance-amount {
            font-weight: bold;
            font-size: 1rem;
            color: var(--gold);
        }

        .header-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .icon-btn {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 6px 10px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
        }

        /* Музыкальный плеер в шапке */
        .music-panel {
            background: rgba(15, 22, 36, 0.95);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.8rem;
        }

        .music-controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .music-controls select, .music-controls button {
            background: var(--card-bg);
            color: white;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 4px 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        /* Основной контент */
        .content {
            flex: 1;
            padding: 16px;
            display: none;
            flex-direction: column;
            gap: 16px;
        }

        .content.active {
            display: flex;
        }

        /* Табы */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: rgba(15, 22, 36, 0.95);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid rgba(255,255,255,0.08);
            z-index: 1000;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-item.active {
            color: var(--accent-hover);
        }

        .nav-item span.icon {
            font-size: 1.2rem;
        }

        /* Карточки кейсов */
        .cases-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .case-card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .case-icon {
            font-size: 3rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .case-title {
            font-weight: bold;
            font-size: 0.95rem;
        }

        .case-btn {
            background: linear-gradient(135deg, #0088cc, #00a0e9);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            width: 100%;
        }

        .case-btn:active {
            transform: scale(0.96);
        }

        /* Кликер (Тапалка) */
        .tap-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            gap: 20px;
            text-align: center;
        }

        .big-star {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffdf00 0%, #ff8c00 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 90px;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.4);
            cursor: pointer;
            transition: transform 0.05s;
        }

        .big-star:active {
            transform: scale(0.92);
        }

        /* Карьеры */
        .career-card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .career-info h4 {
            font-size: 0.95rem;
            margin-bottom: 2px;
        }

        .career-info p {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .upgrade-btn {
            background: #2ea44f;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .upgrade-btn:disabled {
            background: #333;
            color: #777;
            cursor: not-allowed;
        }

        /* Инвентарь */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .inv-item {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            position: relative;
        }

        .inv-item .icon {
            font-size: 2.2rem;
        }

        .inv-item .name {
            font-size: 0.75rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .inv-item .price {
            font-size: 0.7rem;
            color: var(--gold);
        }

        /* Окно рулетки кейса */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }

        .modal-content {
            background: #121824;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .roulette-window {
            width: 100%;
            height: 120px;
            background: #090d14;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            border: 2px solid var(--accent);
            display: flex;
            align-items: center;
        }

        .roulette-strip {
            display: flex;
            position: absolute;
            left: 0;
            transition: left 4s cubic-bezier(0.15, 0.85, 0.35, 1);
        }

        .roulette-item {
            min-width: 100px;
            height: 116px;
            background: #1b2436;
            margin-right: 6px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .roulette-pointer {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 3px;
            background: #ff3344;
            transform: translateX(-50%);
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Шапка -->
        <div class="header">
            <h3 id="ui-app-title">🎁 TG Gift Sim</h3>
            <div class="header-controls">
                <button class="icon-btn" id="lang-btn" onclick="toggleLanguage()">EN / RU</button>
                <div class="balance-box">
                    <span>⭐</span>
                    <span class="balance-amount" id="balance">1000</span>
                </div>
            </div>
        </div>

        <!-- Музыкальный плеер -->
        <div class="music-panel">
            <span id="music-status">🎵 Music: Off</span>
            <div class="music-controls">
                <select id="track-select" onchange="changeTrack(this.value)">
                    <option value="0">Cyber Pop</option>
                    <option value="1">Techno Beat</option>
                    <option value="2">Chill Synth</option>
                    <option value="3">Epic Hype</option>
                </select>
                <button onclick="toggleMusic()" id="music-toggle-btn">Play</button>
                <input type="range" min="0" max="1" step="0.1" value="0.7" style="width: 50px;" onchange="setVolume(this.value)">
            </div>
        </div>

        <!-- Вкладка 1: Кейсы -->
        <div id="tab-cases" class="content active">
            <h3 id="txt-cases-title">📦 Mystery Cases</h3>
            <div class="cases-grid" id="cases-container"></div>
        </div>

        <!-- Вкладка 2: Тапалка -->
        <div id="tab-clicker" class="content">
            <h3 id="txt-clicker-title" style="text-align: center;">Tap Telegram Star</h3>
            <div class="tap-container">
                <div class="big-star" onclick="tapStar(event)">⭐</div>
                <p id="txt-clicker-sub" style="color: var(--text-sub); font-size: 0.85rem;">Tap to earn Stars and level up your income!</p>
            </div>
        </div>

        <!-- Вкладка 3: Карьеры (Пассивный доход) -->
        <div id="tab-careers" class="content">
            <h3 id="txt-careers-title">💼 Career Empire</h3>
            <div id="careers-container" style="display: flex; flex-direction: column; gap: 10px;"></div>
        </div>

        <!-- Вкладка 4: Инвентарь -->
        <div id="tab-inventory" class="content">
            <h3 id="txt-inv-title">🎒 Inventory & Gifts</h3>
            <div class="inventory-grid" id="inventory-container"></div>
        </div>

        <!-- Нижнее меню навигации -->
        <div class="nav-bar">
            <button class="nav-item active" onclick="switchTab('cases', this)">
                <span class="icon">📦</span>
                <span id="nav-cases">Cases</span>
            </button>
            <button class="nav-item" onclick="switchTab('clicker', this)">
                <span class="icon">⭐</span>
                <span id="nav-clicker">Tap</span>
            </button>
            <button class="nav-item" onclick="switchTab('careers', this)">
                <span class="icon">💼</span>
                <span id="nav-careers">Careers</span>
            </button>
            <button class="nav-item" onclick="switchTab('inventory', this)">
                <span class="icon">🎒</span>
                <span id="nav-inv">Inventory</span>
            </button>
        </div>
    </div>

    <!-- Модальное окно рулетки -->
    <div class="modal" id="roulette-modal">
        <div class="modal-content">
            <h3 id="modal-title">Opening Case...</h3>
            <div class="roulette-window">
                <div class="roulette-pointer"></div>
                <div class="roulette-strip" id="roulette-strip"></div>
            </div>
            <button class="case-btn" id="modal-close-btn" onclick="closeModal()" style="display: none;">Awesome!</button>
        </div>
    </div>

    <script>
        // --- ДАННЫЕ И ПЕРЕВОДЫ (RU / EN) ---
        let currentLang = localStorage.getItem('lang') || 'ru';

        const t = {
            ru: {
                appTitle: "🎁 Симулятор Подарков TG",
                cases: "Кейсы",
                tap: "Тапать",
                careers: "Карьера",
                inv: "Инвентарь",
                casesTitle: "📦 Коробки и Кейсы",
                clickerTitle: "Тапай Звезду Telegram",
                clickerSub: "Нажимайте на звезду, чтобы зарабатывать монеты!",
                careersTitle: "💼 Ваши Карьеры и Заработок",
                invTitle: "🎒 Ваши Подарки",
                openBtn: "Открыть за",
                sellBtn: "Продать за",
                closeModal: "Отлично!",
                opening: "Открываем кейс...",
                musicOn: "🎵 Музыка: Вкл",
                musicOff: "🎵 Музыка: Выкл",
                play: "Играть",
                pause: "Пауза"
            },
            en: {
                appTitle: "🎁 TG Gift Simulator",
                cases: "Cases",
                tap: "Tap",
                careers: "Careers",
                inv: "Inventory",
                casesTitle: "📦 Mystery Cases",
                clickerTitle: "Tap Telegram Star",
                clickerSub: "Tap the star to earn coins & level up!",
                careersTitle: "💼 Career Empire",
                invTitle: "🎒 Your Gift Inventory",
                openBtn: "Open for",
                sellBtn: "Sell for",
                closeModal: "Awesome!",
                opening: "Opening case...",
                musicOn: "🎵 Music: On",
                musicOff: "🎵 Music: Off",
                play: "Play",
                pause: "Pause"
            }
        };

        // Состояние игры
        let balance = parseInt(localStorage.getItem('balance')) || 5000;
        let inventory = JSON.parse(localStorage.getItem('inventory')) || [];
        let careers = JSON.parse(localStorage.getItem('careers')) || [
            { id: 1, nameRu: "TG Админ", nameEn: "TG Admin", level: 0, baseIncome: 2, cost: 50 },
            { id: 2, nameRu: "Крипто Трейдер", nameEn: "Crypto Trader", level: 0, baseIncome: 12, cost: 300 },
            { id: 3, nameRu: "TON Кирпич", nameEn: "TON Whale", level: 0, baseIncome: 65, cost: 1500 }
        ];

        // Список подарков
        const giftsCatalog = [
            { id: 1, name: "Telegram Star", icon: "⭐", price: 10, rarity: "common" },
            { id: 2, name: "Heart Box", icon: "💝", price: 50, rarity: "common" },
            { id: 3, name: "Plush Bear", icon: "🧸", price: 250, rarity: "rare" },
            { id: 4, name: "Diamond Ring", icon: "💍", price: 1000, rarity: "epic" },
            { id: 5, name: "Golden Crown", icon: "👑", price: 5000, rarity: "legendary" },
            { id: 6, name: "TON Coin", icon: "💎", price: 15000, rarity: "divine" }
        ];

        // Список кейсов
        const casesList = [
            { id: 1, nameRu: "Базовый кейс", nameEn: "Basic Case", price: 100, icon: "📦" },
            { id: 2, nameRu: "Премиум Кейс", nameEn: "Premium Case", price: 600, icon: "🎁" },
            { id: 3, nameRu: "Эпический бокс", nameEn: "Epic Box", price: 2500, icon: "🔮" },
            { id: 4, nameRu: "Божественный сундук", nameEn: "Divine Chest", price: 10000, icon: "⚡" }
        ];

        // --- WEB AUDIO API (Громкая Музыка и Звуки) ---
        let audioCtx = null;
        let isMusicPlaying = false;
        let musicTimer = null;
        let currentTrackId = 0;
        let musicVolume = 0.7;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function toggleMusic() {
            initAudio();
            if (isMusicPlaying) {
                stopMusic();
            } else {
                startMusic();
            }
        }

        function startMusic() {
            isMusicPlaying = true;
            document.getElementById('music-toggle-btn').innerText = t[currentLang].pause;
            document.getElementById('music-status').innerText = t[currentLang].musicOn;
            playNextNote();
        }

        function stopMusic() {
            isMusicPlaying = false;
            clearTimeout(musicTimer);
            document.getElementById('music-toggle-btn').innerText = t[currentLang].play;
            document.getElementById('music-status').innerText = t[currentLang].musicOff;
        }

        function changeTrack(val) {
            currentTrackId = parseInt(val);
        }

        function setVolume(val) {
            musicVolume = parseFloat(val);
        }

        // Синтезатор музыки по шагам
        let noteStep = 0;
        const tracks = [
            // Track 0: Cyber Pop
            [261.63, 329.63, 392.00, 523.25, 392.00, 329.63],
            // Track 1: Techno Beat
            [130.81, 196.00, 261.63, 196.00, 220.00, 246.94],
            // Track 2: Chill Synth
            [220.00, 261.63, 329.63, 392.00, 440.00, 329.63],
            // Track 3: Epic Hype
            [164.81, 246.94, 329.63, 493.88, 329.63, 246.94]
        ];

        function playNextNote() {
            if (!isMusicPlaying) return;

            try {
                const notes = tracks[currentTrackId];
                const freq = notes[noteStep % notes.length];
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = currentTrackId === 1 ? 'sawtooth' : 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                gain.gain.setValueAtTime(musicVolume * 0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.35);

                noteStep++;
                musicTimer = setTimeout(playNextNote, 250);
            } catch(e) {
                console.error(e);
            }
        }

        // --- ИГРОВАЯ ЛОГИКА ---

        function updateUI() {
            document.getElementById('balance').innerText = Math.floor(balance).toLocaleString();
            localStorage.setItem('balance', balance);
            localStorage.setItem('inventory', JSON.stringify(inventory));
            localStorage.setItem('careers', JSON.stringify(careers));

            renderCases();
            renderCareers();
            renderInventory();
            updateLanguageUI();
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            localStorage.setItem('lang', currentLang);
            updateUI();
        }

        function updateLanguageUI() {
            const loc = t[currentLang];
            document.getElementById('ui-app-title').innerText = loc.appTitle;
            document.getElementById('txt-cases-title').innerText = loc.casesTitle;
            document.getElementById('txt-clicker-title').innerText = loc.clickerTitle;
            document.getElementById('txt-clicker-sub').innerText = loc.clickerSub;
            document.getElementById('txt-careers-title').innerText = loc.careersTitle;
            document.getElementById('txt-inv-title').innerText = loc.invTitle;
            document.getElementById('modal-close-btn').innerText = loc.closeModal;

            document.getElementById('nav-cases').innerText = loc.cases;
            document.getElementById('nav-clicker').innerText = loc.tap;
            document.getElementById('nav-careers').innerText = loc.careers;
            document.getElementById('nav-inv').innerText = loc.inv;
        }

        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            document.getElementById('tab-' + tabName).classList.add('active');
            btnElement.classList.add('active');
        }

        function tapStar(e) {
            balance += 5;
            updateUI();
        }

        // Отрисовка кейсов
        function renderCases() {
            const container = document.getElementById('cases-container');
            container.innerHTML = '';
            casesList.forEach(c => {
                const name = currentLang === 'ru' ? c.nameRu : c.nameEn;
                container.innerHTML += `
                    <div class="case-card">
                        <div class="case-icon">${c.icon}</div>
                        <div class="case-title">${name}</div>
                        <button class="case-btn" onclick="openCase(${c.price})">${t[currentLang].openBtn} ${c.price} ⭐</button>
                    </div>
                `;
            });
        }

        // Рулетка кейса
        function openCase(price) {
            if (balance < price) {
                alert(currentLang === 'ru' ? "Недостаточно звезд!" : "Not enough stars!");
                return;
            }
            balance -= price;
            updateUI();

            const modal = document.getElementById('roulette-modal');
            const strip = document.getElementById('roulette-strip');
            const closeBtn = document.getElementById('modal-close-btn');
            
            modal.style.display = 'flex';
            closeBtn.style.display = 'none';
            strip.innerHTML = '';

            // Генерируем ленту рулетки
            let winningItem = giftsCatalog[Math.floor(Math.random() * giftsCatalog.length)];
            let itemsArray = [];
            for (let i = 0; i < 20; i++) {
                itemsArray.push(giftsCatalog[Math.floor(Math.random() * giftsCatalog.length)]);
            }
            itemsArray[15] = winningItem; // Выигрышный элемент

            itemsArray.forEach(item => {
                strip.innerHTML += `
                    <div class="roulette-item">
                        <span style="font-size: 2rem;">${item.icon}</span>
                        <span style="font-size: 0.65rem; font-weight: bold;">${item.name}</span>
                    </div>
                `;
            });

            strip.style.transition = 'none';
            strip.style.left = '0px';

            setTimeout(() => {
                strip.style.transition = 'left 4s cubic-bezier(0.15, 0.85, 0.35, 1)';
                // Центрируем 15-й элемент под красный указатель
                let offset = -(15 * 106) + 140;
                strip.style.left = offset + 'px';
            }, 50);

            setTimeout(() => {
                inventory.push(winningItem);
                closeBtn.style.display = 'block';
                updateUI();
            }, 4100);
        }

        function closeModal() {
            document.getElementById('roulette-modal').style.display = 'none';
        }

        // Карьеры
        function renderCareers() {
            const container = document.getElementById('careers-container');
            container.innerHTML = '';
            careers.forEach(car => {
                const name = currentLang === 'ru' ? car.nameRu : car.nameEn;
                let currentCost = Math.floor(car.cost * Math.pow(1.15, car.level));
                let income = car.level * car.baseIncome;
                container.innerHTML += `
                    <div class="career-card">
                        <div class="career-info">
                            <h4>${name} (Lvl ${car.level})</h4>
                            <p>+${income} ⭐/sec</p>
                        </div>
                        <button class="upgrade-btn" ${balance < currentCost ? 'disabled' : ''} onclick="upgradeCareer(${car.id})">
                            ${currentCost} ⭐
                        </button>
                    </div>
                `;
            });
        }

        function upgradeCareer(id) {
            let car = careers.find(c => c.id === id);
            let currentCost = Math.floor(car.cost * Math.pow(1.15, car.level));
            if (balance >= currentCost) {
                balance -= currentCost;
                car.level++;
                updateUI();
            }
        }

        // Инвентарь
        function renderInventory() {
            const container = document.getElementById('inventory-container');
            container.innerHTML = '';
            if (inventory.length === 0) {
                container.innerHTML = `<p style="grid-column: span 3; text-align: center; color: var(--text-sub); font-size: 0.8rem;">${currentLang === 'ru' ? 'Инвентарь пуст. Открывайте кейсы!' : 'Inventory is empty. Open some cases!'}</p>`;
                return;
            }
            inventory.forEach((item, index) => {
                container.innerHTML += `
                    <div class="inv-item">
                        <div class="icon">${item.icon}</div>
                        <div class="name">${item.name}</div>
                        <div class="price">${item.price} ⭐</div>
                        <button class="upgrade-btn" style="padding: 4px 8px; font-size: 0.65rem; width: 100%; margin-top: 4px;" onclick="sellItem(${index})">${currentLang === 'ru' ? 'Продать' : 'Sell'}</button>
                    </div>
                `;
            });
        }

        function sellItem(index) {
            balance += inventory[index].price;
            inventory.splice(index, 1);
            updateUI();
        }

        // Пассивный доход каждую секунду от карьер
        setInterval(() => {
            let totalIncome = careers.reduce((sum, car) => sum + (car.level * car.baseIncome), 0);
            if (totalIncome > 0) {
                balance += totalIncome / 10; // 10 раз в секунду плавно
                updateUI();
            }
        }, 100);

        // Первый запуск
        updateUI();
    </script>
</body>
</html>
